<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Astra — Personal AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, #26344f 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #321d38 0%, transparent 35%),
        #05070b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .glass {
      width: min(90%, 520px);
      padding: 55px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 32px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow:
        0 25px 80px rgba(0,0,0,0.5),
        inset 0 1px rgba(255,255,255,0.12);
    }

    .logo {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -4px;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 18px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 35px;
    }

    .download {
      display: inline-block;
      padding: 16px 32px;
      border-radius: 18px;
      background: white;
      color: black;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      transition: 0.25s;
    }

    .download:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(255,255,255,0.2);
    }

    .info {
      margin-top: 22px;
      color: rgba(255,255,255,0.45);
      font-size: 13px;
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>

<body>

  <div class="glass">

    <div class="logo">ASTRA</div>

    <div class="tagline">
      Your personal AI assistant.
    </div>

    <a
      class="download"
      href="https://github.com/darshbhavsar2008-ops/astra-download/releases/download/v1.0.0/app-release.apk">
      Download Astra
    </a>

    <div class="info">
      Android · Version 1.0.0 · 59.6 MB
    </div>

    <div class="footer">
      Built with Flutter · Astra
    </div>

  </div>

</body>
</html>
